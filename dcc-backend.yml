version: "3.9"

services:
  yrlmz-food-order-api:
    container_name: yrlmz-food-order-api
    image: ghcr.io/onuryrlmz/food-order-api:latest
    security_opt:
      - seccomp:unconfined
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Europe/Istanbul
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FoodOrderApp=${DB_CONNECTION_STRING}
      - Redis__Host=${REDIS_HOST:-food-order-redis}
      - Redis__Port=${REDIS_PORT:-6379}
      - Redis__Password=${REDIS_PASSWORD:-}
      - Redis__Ssl=false
      - TokenOptions__SecurityKey=${TOKEN_SECURITY_KEY}
      - AwsS3__Domain=${R2_DOMAIN}
      - AwsS3__Endpoint=${R2_ENDPOINT}
      - AwsS3__BucketName=${R2_BUCKET}
      - AwsS3__AccessKey=${R2_ACCESS_KEY}
      - AwsS3__SecretKey=${R2_SECRET_KEY}
      - AwsS3__Token=${R2_TOKEN}
      - MailSettings__Server=${SMTP_SERVER:-smtp.mandrillapp.com}
      - MailSettings__Port=${SMTP_PORT:-587}
      - MailSettings__UserName=${SMTP_USER:-}
      - MailSettings__Password=${SMTP_PASSWORD:-}
      - MailSettings__SenderEmail=${SMTP_FROM:-}
      - AiSupport__ApiKey=${AI_SUPPORT_API_KEY:-}
      - AiSupport__Model=${AI_SUPPORT_MODEL:-claude-sonnet-4-20250514}
      - WebAPIConfiguration__AllowedOrigins__0=https://food-order-admin.yrlmzteknoloji.com
      - WebAPIConfiguration__AllowedOrigins__1=https://food-order-seller.yrlmzteknoloji.com
      - WebAPIConfiguration__AllowedOrigins__2=http://food-order-admin.yrlmzteknoloji.com
      - WebAPIConfiguration__AllowedOrigins__3=http://food-order-seller.yrlmzteknoloji.com
      - WebAPIConfiguration__AllowedOrigins__4=http://localhost:3000
      - WebAPIConfiguration__AllowedOrigins__5=http://localhost:3001
    networks:
      - proxy-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yrlmz-food-order-api-http.rule=Host(`food-order-api.yrlmzteknoloji.com`)"
      - "traefik.http.routers.yrlmz-food-order-api-http.entrypoints=web-http"
      - "traefik.http.routers.yrlmz-food-order-api-https.rule=Host(`food-order-api.yrlmzteknoloji.com`)"
      - "traefik.http.routers.yrlmz-food-order-api-https.entrypoints=web-https"
      - "traefik.http.routers.yrlmz-food-order-api-https.tls=true"
      - "traefik.http.services.yrlmz-food-order-api.loadbalancer.server.port=8080"

networks:
  proxy-net:
    external: true
