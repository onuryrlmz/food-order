      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FoodOrderApp=${DB_CONNECTION_STRING}
      - Redis__Host=${REDIS_HOST:-food-order-redis}
      - Redis__Port=${REDIS_PORT:-6379}
      - Redis__Password=${REDIS_PASSWORD:-}
