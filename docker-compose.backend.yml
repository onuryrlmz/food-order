version: '3.8'
services:
  food-order-api:
    image: ${REGISTRY:-ghcr.io/onuryorulmaz}/food-order-api:${TAG:-latest}
    environment:
      - TZ=Europe/Istanbul
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__FoodOrderApp=${DB_CONNECTION_STRING}
      - Redis__Host=${REDIS_HOST:-food-order-redis}
      - Redis__Port=${REDIS_PORT:-6379}
      - Redis__Password=${REDIS_PASSWORD:-}
      - Redis__Ssl=false
      - TokenOptions__SecurityKey=${TOKEN_SECURITY_KEY}
      - AwsS3__Domain=${S3_DOMAIN}
      - AwsS3__Endpoint=${S3_ENDPOINT}
      - AwsS3__BucketName=${S3_BUCKET}
      - AwsS3__AccessKey=${S3_ACCESS_KEY}
      - AwsS3__SecretKey=${S3_SECRET_KEY}
      - MailSettings__Server=${SMTP_SERVER:-smtp.mandrillapp.com}
      - MailSettings__Port=${SMTP_PORT:-587}
      - MailSettings__UserName=${SMTP_USER}
      - MailSettings__Password=${SMTP_PASSWORD}
      - MailSettings__SenderEmail=${SMTP_FROM}
      - AiSupport__ApiKey=${AI_SUPPORT_API_KEY:-}
      - AiSupport__Model=${AI_SUPPORT_MODEL:-claude-sonnet-4-20250514}
      - WebAPIConfiguration__AllowedOrigins__0=https://${ADMIN_DOMAIN}
      - WebAPIConfiguration__AllowedOrigins__1=https://${SELLER_DOMAIN}
      - WebAPIConfiguration__AllowedOrigins__2=https://${APP_DOMAIN:-app.esnaftan.com}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.host-name == w2
      labels:
        - traefik.enable=true
        - traefik.network=traefik
        - traefik.http.routers.food-api-http.rule=Host(`${API_DOMAIN}`)
        - traefik.http.routers.food-api-http.entrypoints=web
        - traefik.http.routers.food-api-https.rule=Host(`${API_DOMAIN}`)
        - traefik.http.routers.food-api-https.entrypoints=websecure
        - traefik.http.routers.food-api-https.tls=true
        - traefik.http.services.food-api.loadbalancer.server.port=8080
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
    networks:
      - traefik
      - food-internal

networks:
  traefik:
    external: true
  food-internal:
    external: true
